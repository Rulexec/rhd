name: rhd_test
description: E2E test with mock AI server and random command
actions:
  - type: runCommand
    name: cmd1
    cmd: $E2E_SCRIPTS_DIR/random_cmd.sh
  - type: aiChat
    name: ai1
    model: test_model
    systemPrompt: "You received: %cmd1.stdout%"
    message: "Exit code was %cmd1.exitCode%, success=%cmd1.success%, cwd=%cmd1.cwd%"
  - type: output
    name: out1
    output: "AI said: %ai1.message%"

name: e2e_test
description: End-to-end test scenario with all action types
actions:
  - type: runCommand
    name: echo_step
    command: echo
    args: ["hello", "world"]
  - type: output
    name: output_step
    text: "Command output: %echo_step.stdout%"
  - type: runCommand
    name: check_exit
    command: sh
    args: ["-c", "exit 0"]

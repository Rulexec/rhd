[tasks]
test-frontend-unit = { dir = "frontend", run = ["npm run test:unit"] }

[tasks.test-cargo]
depends = ["cargo-build"]
run = ["cargo test"]

[tasks.cargo-build]
run = ["cargo build"]

[tasks.test-frontend-e2e]
dir = "frontend"
depends = ["cargo-build"]
run = ["npm run test:e2e"]

[tasks.test-frontend]
depends = ["test-frontend-unit", "test-frontend-e2e"]

[tasks.test-e2e]
depends = ["cargo-build"]
run = ["cargo run -p rhd_test{{arg(name='rhd_test_args', var=true, prefix=' -- ', required=false)}}"]

[tasks.test-all]
depends = ["test-frontend-unit", "test-frontend-e2e", "test-cargo", "test-e2e"]

[tasks.cloc-frontend]
run = ["cloc --vcs=git --not-match-f='package.*\\.json' frontend/"]

[tasks.cloc-backend]
run = ["cloc --vcs=git packages/"]

[tasks.cloc-memory]
run = ["cloc --vcs=git memory/"]

[tasks.cloc-plans]
run = ["cloc --vcs=git plans/"]

[tasks.cloc]
run = [
  "mise run cloc-frontend",
  "mise run cloc-backend",
  "mise run cloc-memory",
  "mise run cloc-plans",
]

[tasks.cloc-all]
run = ["cloc --vcs=git --not-match-f='package.*\\.json' frontend/ packages/ memory/ plans/"]

[tasks.check-svelte]
dir = "frontend"
run = ["./node_modules/.bin/svelte-check"]

[tasks.check-cargo]
run = ["cargo check"]

[tasks.check]
depends = ["check-svelte", "check-cargo"]

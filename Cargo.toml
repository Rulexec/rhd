[workspace]
members = [
    "packages/rhd_ai_client",
    "packages/rhd_mock_ai_provider",
    "packages/rhd_mcp_client",
    "packages/rhd_db",
    "packages/rhd_chat_api",
    "packages/rhd_chat_server",
    "packages/rhd_chat_client",
    "packages/rhd_app",
    "plugins/rhd_plugin_ai_completions",
    "plugins/rhd_plugin_system_prompt",
    "plugins/rhd_plugin_todo_list",
    "plugins/rhd_plugin_mcp",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rkyv = { version = "0.7", features = ["validation"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
exponential-backoff = "2.1.0"
